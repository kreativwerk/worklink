# WorkLink — self-hosted stack für den VPS.
# Start:  docker compose up -d --build
# Werte in .env setzen (siehe .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: worklink-app
    restart: unless-stopped
    # Hängt sich zusätzlich ins Netz des zentralen Proxys (kiara-Caddy) ein,
    # damit dessen reverse_proxy worklink-app:3000 dauerhaft erreichbar bleibt —
    # auch nachdem der kiara-Caddy neu erstellt wurde.
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
      UPLOAD_DIR: /data/uploads
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - uploads:/data/uploads
    expose:
      - "3000"

  # Nur nötig, wenn WorkLink der einzige Dienst auf dem Server ist.
  # Läuft bereits ein zentraler Reverse-Proxy (z. B. der Caddy einer anderen
  # App), diesen Dienst weglassen — Start dann mit: docker compose up -d
  # (Profil "standalone" aktiviert ihn: docker compose --profile standalone up -d)
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  # Netz des zentralen Proxys (Compose-Projekt "kiara").
  proxy:
    external: true
    name: kiara_default
